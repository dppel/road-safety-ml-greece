project:
  name: "road-safety-ml-greece"
  version: "1.1.0"
  random_seed: 42
  data_policy: "100% Official ELSTAT Aggregated Statistics (Zero Synthetic Data)"

data:
  regional_panel_path: "data/elstat_regional_monthly_panel_2021_2025.csv"
  national_annual_path: "data/elstat_national_annual_2015_2024.csv"
  train_end_year: 2023
  val_year: 2024
  test_year: 2025

regional_task:
  unit_of_observation: "region_year_month"
  target_column: "target_high_ksi"
  rate_column: "ksi_severity_rate"
  high_ksi_threshold: 0.16
  numeric_features:
    - "month"
    - "month_sin"
    - "month_cos"
    - "is_summer"
    - "urban_ratio"
    - "motorcycle_share"
    - "lag_1m_ksi_rate"
    - "lag_2m_ksi_rate"
    - "lag_12m_ksi_rate"
    - "rolling_3m_ksi_rate"
    - "yoy_ksi_rate_diff"
    - "lag_1m_total_accidents"
    - "lag_12m_total_accidents"
  categorical_features:
    - "region"
  forbidden_leakage_columns:
    - "ksi_accidents"
    - "fatal_accidents"
    - "serious_accidents"
    - "slight_accidents"
    - "ksi_severity_rate"
    - "total_accidents"

models:
  dummy:
    strategy: "prior"
  decision_tree:
    max_depth: 4
    min_samples_leaf: 15
    class_weight: "balanced"
  random_forest:
    n_estimators: 200
    max_depth: 6
    min_samples_leaf: 10
    class_weight: "balanced"
  hist_gradient_boosting:
    max_iter: 200
    learning_rate: 0.04
    max_leaf_nodes: 15
    min_samples_leaf: 15
    class_weight: "balanced"
  xgboost:
    n_estimators: 200
    learning_rate: 0.04
    max_depth: 4
    subsample: 0.8
    colsample_bytree: 0.8
