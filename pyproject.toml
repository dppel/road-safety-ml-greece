[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "road-safety-ml-greece"
version = "1.0.0"
description = "Explainable machine learning pipeline for road traffic accident severity (KSI) analysis in Greece using official ELSTAT statistics."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Dimitris P."}
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
boosting = [
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
]
explain = [
    "shap>=0.43.0",
]
app = [
    "streamlit>=1.28.0",
]
dev = [
    "pytest>=7.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
